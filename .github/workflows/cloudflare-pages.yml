name: Deploy UI to Cloudflare Pages
# Triggers deployment of static assets and Pages Functions. (retry marker)

on:
  push:
    branches:
      - main
    paths:
      - "apps/ui/**"
      - "wrangler.toml"
      - ".github/workflows/cloudflare-pages.yml"
  workflow_dispatch:
    inputs:
      reason:
        description: "Reason for manual deploy"
        required: false
        default: "Manual deploy"

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Wrangler
        run: npm install --global wrangler@4

      - name: Ensure Pages project exists
        run: wrangler pages project create ecodrop-ui --production-branch main || true

      - name: Deploy to Cloudflare Pages
        run: wrangler pages deploy apps/ui --project-name ecodrop-ui --branch main
